short_bio_text_justify: true
short_bio: >-
  <p>
    我是中国科学院自动化研究所的博士研究生，研究方向为<strong>多模态理解</strong>、<strong>多模态异常检测</strong>和<strong>零/少样本学习</strong>。
  </p>

  <p>
    我于2022年进入中国科学院自动化研究所攻读博士学位（硕博连读），博士课题为《基于视觉语言模型的异常检测方法研究》。
    此前，我于2018年至2022年在西安电子科技大学人工智能学院获得学士学位，专业为智能科学与技术。
  </p>

  <p>
    我的研究兴趣包括：多模态大模型、零样本/少样本异常检测、工业视觉、图像分割。
    在 CVPR、ICCV、ECCV 等顶级会议和 IEEE TMM、TCSVT、TII 等顶级期刊发表学术论文11篇，其中第一作者论文6篇。
    论文累计引用超过200次，其中 CVPR 2024 论文 VCP-CLIP 单篇引用136次。
  </p>

  <p>
    我曾获得2024年<strong>国家奖学金</strong>、2026年<strong>攀登奖学金</strong>等荣誉，并入选中国科协"博士青培"专项计划。
    在学术竞赛方面，曾获 CVPR 2025/2026 VLM Anomaly Challenge 赛道冠军、CVPR 2023 Vision 挑战赛亚军等。
  </p>

  <p>
    我担任 CVPR、ICCV、ECCV、NeurIPS、ICLR、AAAI 等顶级会议和 IEEE TII、TCSVT、TIM 等顶刊的审稿人。
  </p>

