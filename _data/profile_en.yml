short_bio: >-
  <p>
    I am a Ph.D. candidate at the <strong>Institute of Automation, Chinese Academy of Sciences</strong> (CASIA), working on <strong>Multimodal Understanding</strong>, <strong>Multimodal Anomaly Detection</strong>, and <strong>Zero/Few-shot Learning</strong>.
  </p>

  <p>
    I joined CASIA in 2022 for my Ph.D. (direct Ph.D. track) under the supervision of Prof. [Name], focusing on anomaly detection with vision-language models.
    Previously, I received my B.Eng. degree in Intelligent Science and Technology from Xidian University (2018-2022).
  </p>

  <p>
    My research interests include: multimodal large language models, zero-shot/few-shot anomaly detection, industrial vision, and image segmentation.
    I have published 11 papers in top conferences (CVPR, ICCV, ECCV) and journals (IEEE TMM, TCSVT, TII), with 6 first-author papers.
    My work has received over 200 citations, with VCP-CLIP (ECCV 2024) alone cited 136 times.
  </p>

  <p>
    I have been honored with the <strong>National Scholarship</strong> (2024), <strong>Climbing Scholarship</strong> (2026), and was selected into the "Young Talents Cultivation Program" by the China Association for Science and Technology.
    In academic competitions, I won the CVPR 2025/2026 VLM Anomaly Challenge Champion and CVPR 2023 Vision Challenge Runner-up.
  </p>

  <p>
    I serve as a reviewer for top conferences (CVPR, ICCV, ECCV, NeurIPS, ICLR, AAAI) and journals (IEEE TII, TCSVT, TIM).
  </p>

